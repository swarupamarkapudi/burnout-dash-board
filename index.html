<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Stress Awareness</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom right, #f8f9fa, #e9ecef);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #ff6b6b;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        p {
            font-size: 1.2rem;
            margin: 15px 0;
            line-height: 1.6;
        }

        .highlight {
            color: #1e90ff;
            font-weight: bold;
        }

        .button {
            margin-top: 30px;
            padding: 12px 25px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #ff4b4b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Stress Alert</h1>
        <p>Employees work <span class="highlight">long hours</span></p>
        <p>Deadlines create <span class="highlight">constant pressure</span></p>
        <p>Stress builds <span class="highlight">silently</span></p>
        <p>Managers notice only when <span class="highlight">performance drops</span></p>
        <button class="button">Learn How to Help</button>
    </div>
</body>
</html>
